name: ailoviu_app
description: Nuestra app.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.13.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: 1.0.8

  # ── Estado y persistencia ───────────────────────────────────────
  flutter_riverpod: ^2.5.1
  shared_preferences: ^2.3.0
  flutter_secure_storage: ^9.2.2

  # ── Info del bundle ─────────────────────────────────────────────
  package_info_plus: ^8.0.0

  # ── Auth del dispositivo ────────────────────────────────────────
  local_auth: ^2.3.0

  # ── Hashing local (PIN fallback) ────────────────────────────────
  crypto: ^3.0.0

  # ── Formas M3E ──────────────────────────────────────────────────
  m3e_shapes:
    path: packages/m3e_shapes

  # ── Sync: Firebase ──────────────────────────────────────────────
  firebase_core: ^3.6.0
  firebase_database: ^11.1.4
  firebase_storage: ^12.3.4
  firebase_messaging: ^15.1.3

  # ── Criptografía E2EE (AES-GCM, X25519, HKDF) ──────────────────
  cryptography: ^2.7.0

  # ── Utilidades ──────────────────────────────────────────────────
  uuid: ^4.5.1
  collection: ^1.18.0

  # ── Notificaciones locales (FCM muestra la notificación) ───────
  flutter_local_notifications: ^17.2.3

  # ── Servicio en primer plano (recibir con la app cerrada) ──────
  flutter_foreground_task: ^11.0.3

  # ── Emparejamiento por QR ──────────────────────────────────────
  qr_flutter: ^4.1.0
  mobile_scanner: ^5.2.3

  # ── Share sheet (para exportar fotos, compartir config) ────────
  share_plus: ^10.0.2

  # ── Abrir enlaces externos ─────────────────────────────────────
  url_launcher: ^6.3.0

  # ── Juegos en persona (Nearby Connections) ─────────────────────
  nearby_connections: ^4.3.0

  # ── Mapa (OSM gratis, sin API key) ─────────────────────────────
  flutter_map: ^7.0.2
  latlong2: ^0.9.1

  # ── Ubicación del dispositivo ──────────────────────────────────
  geolocator: ^13.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: 4.0.0

flutter:
  uses-material-design: true