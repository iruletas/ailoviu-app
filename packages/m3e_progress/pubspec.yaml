version: 0.1.0
publish_to: 'none'

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter
  m3e_shapes:
    path: ../m3e_shapes
  vector_math: ^2.4.3