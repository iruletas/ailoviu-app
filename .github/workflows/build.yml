name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 30

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v5

      - name: Borrar artifacts previos de ailoviu_app-release
        env:
          GH_TOKEN: ${{ secrets.GH_PAT_FOR_CLEANUP }}
          REPO: ${{ github.repository }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "⚠️ GH_PAT_FOR_CLEANUP no está configurado. Se omite la limpieza."
            exit 0
          fi
          PAGE=1
          BORRADOS=0
          while true; do
            RESPONSE=$(curl -s -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/$REPO/actions/artifacts?per_page=100&page=$PAGE")
            IDS=$(echo "$RESPONSE" | jq -r '.artifacts[] | select(.name == "ailoviu_app-release") | .id')
            if [ -z "$IDS" ]; then
              echo "Página $PAGE: sin artifacts coincidentes. Fin de la búsqueda."
              break
            fi
            for ID in $IDS; do
              echo "Borrando artifact ID=$ID..."
              curl -s -X DELETE \
                -H "Authorization: Bearer $GH_TOKEN" \
                -H "Accept: application/vnd.github+json" \
                "https://api.github.com/repos/$REPO/actions/artifacts/$ID"
              BORRADOS=$((BORRADOS + 1))
            done
            PAGE=$((PAGE + 1))
          done
          echo "✅ Total de artifacts borrados: $BORRADOS"

      - name: Liberar espacio en disco
        run: |
          echo "Espacio ANTES de limpiar:"
          df -h /
          sudo rm -rf /usr/local/.ghcup || true
          sudo rm -rf /usr/local/share/powershell || true
          sudo rm -rf /usr/local/julia1.13.1 || true
          sudo rm -rf /usr/local/share/chromium || true
          sudo rm -rf /usr/local/aws-cli || true
          sudo rm -rf /usr/local/aws-sam-cli || true
          sudo rm -rf /home/runner/.rustup || true
          sudo rm -rf /home/runner/.dotnet || true
          sudo rm -rf /home/linuxbrew || true
          echo "Espacio DESPUÉS de limpiar:"
          df -h /

      - name: Configurar Java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: 'stable'
          cache: true

      - name: Cache de Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Generar archivos faltantes de Flutter
        run: |
          flutter create --platforms=android --org com.iruletas --project-name ailoviu .

      - name: Auto-incrementar versionCode en pubspec.yaml
        run: |
          NEW_VERSION_CODE=${{ github.run_number }}
          echo "Nuevo versionCode: $NEW_VERSION_CODE"
          sed -i -E "s/^version: ([0-9.]+)\+[0-9]+/version: \1+${NEW_VERSION_CODE}/" pubspec.yaml
          echo "pubspec.yaml actualizado:"
          grep "^version:" pubspec.yaml

      - name: Decodificar keystore de release
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "ERROR: KEYSTORE_BASE64 no está configurado."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/ailoviu-release-key.jks

      - name: Crear key.properties
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          cat > android/key.properties <<EOF
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=ailoviu-release-key.jks
          EOF
          echo "key.properties creado."

      - name: Configurar Gradle (eliminar y recrear)
        run: |
          rm -f android/app/build.gradle.kts
          cat > android/app/build.gradle.kts <<'EOF'
          import java.util.Properties
          import java.io.FileInputStream

          plugins {
              id("com.android.application")
              id("kotlin-android")
              id("dev.flutter.flutter-gradle-plugin")
          }

          android {
              namespace = "com.iruletas.ailoviu"
              compileSdk = flutter.compileSdkVersion
              ndkVersion = flutter.ndkVersion

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = JavaVersion.VERSION_17.toString()
              }

              defaultConfig {
                  applicationId = "com.iruletas.ailoviu"
                  minSdk = flutter.minSdkVersion
                  targetSdk = flutter.targetSdkVersion
                  versionCode = flutter.versionCode
                  versionName = flutter.versionName
              }

              signingConfigs {
                  create("release") {
                      val keystoreProperties = Properties()
                      val keystorePropertiesFile = rootProject.file("key.properties")
                      if (keystorePropertiesFile.exists()) {
                          keystoreProperties.load(FileInputStream(keystorePropertiesFile))
                      }
                      keyAlias = keystoreProperties["keyAlias"] as String?
                      keyPassword = keystoreProperties["keyPassword"] as String?
                      storeFile = keystoreProperties["storeFile"]?.let { file(it) }
                      storePassword = keystoreProperties["storePassword"] as String?
                  }
              }

              buildTypes {
                  release {
                      signingConfig = signingConfigs.getByName("release")
                  }
              }
          }

          flutter {
              source = "../.."
          }
          EOF
          
          echo "=== CONTENIDO DEL ARCHIVO ==="
          cat android/app/build.gradle.kts
          echo "=== FIN DEL ARCHIVO ==="

      - name: Descargar dependencias
        run: flutter pub get

      - name: Compilar APK
        run: flutter build apk --release

      - name: Subir APK como artifact
        uses: actions/upload-artifact@v4
        with:
          name: ailoviu_app-release
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30