name: Generar Llave y Base64
on: workflow_dispatch

jobs:
  generar:
    runs-on: ubuntu-latest
    steps:
      - name: Generar keystore
        run: |
          keytool -genkey -v -keystore app-release-key.jks \
          -keyalg RSA -keysize 2048 -validity 10000 \
          -alias ailoviu -storepass ailoviu123 -keypass ailoviu123 \
          -dname "CN=Ailoviu, OU=App, O=Iruletas, L=MX, S=MX, C=MX"
      
      - name: Convertir a Base64 e imprimir en el log
        run: |
          echo "=== COPIA EL TEXTO DE ABAJO ==="
          base64 -w 0 app-release-key.jks
          echo ""
          echo "=== FIN DEL TEXTO ==="