name: Reorganize

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Solo mostrar cambios, no aplicar'
        required: true
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'

jobs:
  reorganize:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          token: ${{ secrets.GH_PAT_FOR_CLEANUP }}

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Reorganizar
        env:
          DRY_RUN: ${{ inputs.dry_run }}
        run: python tools/reorganize.py

      - name: Commit y push
        if: ${{ inputs.dry_run == 'false' }}
        env:
          GH_TOKEN: ${{ secrets.GH_PAT_FOR_CLEANUP }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Sin cambios. Nada que commitear."
            exit 0
          fi
          git commit -m "chore: reorganizar estructura de lib/"
          git push